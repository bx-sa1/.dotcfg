# Configuration for flavours
# https://github.com/Misterio77/flavours
#
# This file should contain a [[items]] section for each application you want themed
# You can also set a shell (outside items) on which to run hooks
# Check flavours repository for more information and examples


# Explanation and default values for keys:

# # Through which shell command hooks will run. The command will be replaced in '{}'
# shell = "sh -c '{}'"
#
# [[items]]
# # File to inject to, supports tilde and env var expansion. required
# file = "~/.config/example"
# # Template to use. required
# template = "example"
#
# # Subtemplate to use
# subtemplate = "default"
# # If not rewriting, on which line (usually a comment) to start replacing
# start = "# Start flavours"
# # If not rewriting, on which line (usually a comment) to stop replacing
# end = "# End flavours"
# # Should we rewrite the entire file, instead of using the above delimiters?
# rewrite = false
# # Command to execute after injecting (goes through shell)
# hook = ""
# # Whether this hook should be executed when flavours is ran with lightweight flag
# light = true


# Example file. For sway, waybar and (beautiful)discord. Runs hooks through bash:

# shell = "bash -c '{}'"
#
# [[items]]
# file = "~/.config/sway/config"
# template = "sway"
# subtemplate = "colors"
# hook = "swaymsg reload"
# light = false
#
# [[items]]
# file = "~/.config/waybar/colors.css"
# template = "waybar"
# rewrite = true
# 
# [[items]]
# file = "~/.config/beautifuldiscord/style.css"
# template = "styles"
# subtemplate = "css-variables"
# start= "/* Start flavours */"
# end = "/* End flavours */"

shell = "sh -c '{}'"

[[items]]
file = "~/.cache/flavours/colors.Xresources"
template = "xresources"
subtemplate = "base16"
rewrite = true
hook = "xrdb -merge -quiet '~/.cache/flavours/colors.Xresources'"

[[items]]
file = "~/.cache/flavours/colors.json"
template = "json"
rewrite = true

[[items]]
file = "~/.config/nvim/lua/base16.lua"
template = "nvim"
rewrite = true

[[items]]
file = "~/.config/rofi/colors.rasi"
template = "rofi"
rewrite = true

[[items]]
file = "~/.colors"
template = "shell"
rewrite = true
hook = "for t in /dev/pts/*; do source ~/.colors > $t; done"

[[items]]
file = "~/.config/xmonad/Colors.hs"
template = "xmonad"
rewrite = true
hook = "xmonad --recompile && xmonad --restart"

[[items]]
file = "~/.config/polybar/colors.ini"
template = "polybar"
hook="polybar-msg cmd restart"
rewrite = true

[[items]]
file = "~/.config/qutebrowser/colors.py"
template = "qutebrowser"
hook = "qutebrowser :config-source"
rewrite = true
